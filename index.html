<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSV Grid Filter</title>
    <style>
      :root {
        --bg: #f7f8fb;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #d1d5db;
        --primary: #2563eb;
        --primary-soft: #dbeafe;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Noto Sans TC", "Segoe UI", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      .info-card,
      .desc-card,
      .toolbar,
      .grid-wrap {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      .info-card,
      .desc-card {
        padding: 14px;
        margin-bottom: 12px;
      }

      .card-title {
        margin: 0 0 8px;
        font-size: 15px;
        color: var(--muted);
      }

      .md-body {
        margin: 0;
        line-height: 1.7;
        white-space: pre-wrap;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 14px;
        padding: 12px;
      }

      .btn {
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text);
        padding: 8px 12px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 14px;
      }

      .btn:hover {
        border-color: var(--primary);
      }

      .btn.active {
        border-color: var(--primary);
        background: var(--primary-soft);
        color: var(--primary);
        font-weight: 700;
      }

      .btn.clear {
        border-color: #fca5a5;
        color: #b91c1c;
      }

      .grid-wrap {
        overflow: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border-bottom: 1px solid #e5e7eb;
        border-right: 1px solid #e5e7eb;
        padding: 10px;
        text-align: left;
        vertical-align: top;
        min-width: 120px;
      }

      th {
        background: #f3f4f6;
        position: sticky;
        top: 0;
        z-index: 1;
      }

      tr:last-child td {
        border-bottom: none;
      }

      .meta {
        margin: 8px 0 14px;
        color: var(--muted);
        font-size: 14px;
      }

      .error {
        color: #b91c1c;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <section class="info-card">
        <h2 class="card-title">網頁資訊</h2>
        <p id="info" class="md-body"></p>
      </section>

      <section class="desc-card">
        <h2 class="card-title">補充說明</h2>
        <p id="desc" class="md-body"></p>
      </section>

      <div id="toolbar" class="toolbar"></div>
      <div id="meta" class="meta"></div>
      <div class="grid-wrap">
        <table id="grid">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <script>
      const DATA_PATH = "./data.csv";
      const INFO_PATH = "./info.md";
      const DESC_PATH = "./desc.md";
      const HINTS_PATH = "./hints.csv";
      const FBUTTON_PREFIX = "fbutton:";

      const infoEl = document.getElementById("info");
      const descEl = document.getElementById("desc");
      const toolbarEl = document.getElementById("toolbar");
      const metaEl = document.getElementById("meta");
      const theadEl = document.querySelector("#grid thead");
      const tbodyEl = document.querySelector("#grid tbody");

      const state = {
        rows: [],
        columns: [],
        displayColumns: [],
        filters: [],
        activeFilterKeys: new Set(),
        hintsByKey: new Map(),
      };

      function parseCsv(text) {
        const rows = [];
        let current = "";
        let row = [];
        let inQuotes = false;

        for (let i = 0; i < text.length; i += 1) {
          const char = text[i];
          const next = text[i + 1];

          if (char === '"') {
            if (inQuotes && next === '"') {
              current += '"';
              i += 1;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (char === "," && !inQuotes) {
            row.push(current);
            current = "";
          } else if ((char === "\n" || char === "\r") && !inQuotes) {
            if (char === "\r" && next === "\n") {
              i += 1;
            }
            row.push(current);
            if (row.some((cell) => cell.trim() !== "")) {
              rows.push(row);
            }
            row = [];
            current = "";
          } else {
            current += char;
          }
        }

        if (current.length > 0 || row.length > 0) {
          row.push(current);
          if (row.some((cell) => cell.trim() !== "")) {
            rows.push(row);
          }
        }

        return rows;
      }

      function normalizeHeaderName(header) {
        const raw = String(header || "").trim();
        if (raw.toLowerCase().startsWith(FBUTTON_PREFIX)) {
          return raw.slice(FBUTTON_PREFIX.length).trim() || raw;
        }
        return raw;
      }

      function truthyCell(value) {
        const normalized = String(value ?? "")
          .trim()
          .toLowerCase();

        if (!normalized) {
          return false;
        }

        return !["0", "false", "no", "off", "null", "none", "n"].includes(normalized);
      }

      function normalizeRows(headers, rawRows) {
        return rawRows.map((rawRow, rowIndex) => {
          const obj = { __rowId: rowIndex };
          headers.forEach((h, i) => {
            obj[h] = rawRow[i] ?? "";
          });
          return obj;
        });
      }

      function toFilterMeta(rawHeader, index) {
        const header = String(rawHeader || "").trim();
        if (!header.toLowerCase().startsWith(FBUTTON_PREFIX)) {
          return null;
        }

        const label = normalizeHeaderName(header) || `Filter ${index + 1}`;
        return {
          key: `filter_${index}`,
          columnIndex: index,
          label,
          rawHeader: header,
        };
      }

      function getHint(rawHeader, displayName) {
        return (
          state.hintsByKey.get(rawHeader) ||
          state.hintsByKey.get(displayName) ||
          state.hintsByKey.get(String(rawHeader || "").toLowerCase()) ||
          state.hintsByKey.get(String(displayName || "").toLowerCase()) ||
          ""
        );
      }

      async function fetchText(path, required = true) {
        const response = await fetch(path, { cache: "no-store" });
        if (!response.ok) {
          if (required) {
            throw new Error(`無法讀取 ${path}（HTTP ${response.status}）`);
          }
          return "";
        }
        return response.text();
      }

      function activeRows() {
        if (state.activeFilterKeys.size === 0) {
          return state.rows;
        }

        const activeFilters = state.filters.filter((filter) => state.activeFilterKeys.has(filter.key));
        return state.rows.filter((row) => {
          return activeFilters.every((filter) => truthyCell(row[state.columns[filter.columnIndex]]));
        });
      }

      function renderToolbar() {
        toolbarEl.innerHTML = "";

        const clearBtn = document.createElement("button");
        clearBtn.className = "btn clear";
        clearBtn.textContent = "清除篩選";
        clearBtn.addEventListener("click", () => {
          state.activeFilterKeys.clear();
          renderToolbar();
          renderGrid();
        });
        toolbarEl.appendChild(clearBtn);

        state.filters.forEach((filter) => {
          const btn = document.createElement("button");
          btn.className = "btn";
          btn.textContent = filter.label;
          const hint = getHint(filter.rawHeader, filter.label);
          if (hint) {
            btn.title = hint;
          }

          if (state.activeFilterKeys.has(filter.key)) {
            btn.classList.add("active");
          }

          btn.addEventListener("click", () => {
            if (state.activeFilterKeys.has(filter.key)) {
              state.activeFilterKeys.delete(filter.key);
            } else {
              state.activeFilterKeys.add(filter.key);
            }
            renderToolbar();
            renderGrid();
          });
          toolbarEl.appendChild(btn);
        });
      }

      function renderGrid() {
        const rows = activeRows();

        theadEl.innerHTML = "";
        tbodyEl.innerHTML = "";

        const headRow = document.createElement("tr");
        state.columns.forEach((rawHeader, index) => {
          const displayHeader = state.displayColumns[index];
          const th = document.createElement("th");
          th.textContent = displayHeader;
          const hint = getHint(rawHeader, displayHeader);
          if (hint) {
            th.title = hint;
          }
          headRow.appendChild(th);
        });
        theadEl.appendChild(headRow);

        rows.forEach((rowObj) => {
          const tr = document.createElement("tr");
          state.columns.forEach((rawHeader) => {
            const td = document.createElement("td");
            td.textContent = rowObj[rawHeader];
            tr.appendChild(td);
          });
          tbodyEl.appendChild(tr);
        });

        metaEl.textContent = `資料：${DATA_PATH}｜提示：${HINTS_PATH}｜顯示 ${rows.length} / ${state.rows.length} 筆`;
      }

      function loadHints(hintsText) {
        state.hintsByKey.clear();
        if (!hintsText.trim()) {
          return;
        }

        const matrix = parseCsv(hintsText);
        if (matrix.length <= 1) {
          return;
        }

        const headers = matrix[0].map((h) => String(h || "").trim().toLowerCase());
        const keyIndex = headers.findIndex((h) => ["key", "欄位", "column", "header", "name"].includes(h));
        const hintIndex = headers.findIndex((h) => ["hint", "提示", "description", "說明"].includes(h));

        if (keyIndex < 0 || hintIndex < 0) {
          return;
        }

        matrix.slice(1).forEach((row) => {
          const key = String(row[keyIndex] || "").trim();
          const hint = String(row[hintIndex] || "").trim();
          if (!key || !hint) {
            return;
          }
          state.hintsByKey.set(key, hint);
          state.hintsByKey.set(key.toLowerCase(), hint);
        });
      }

      async function init() {
        try {
          const [dataText, infoText, descText, hintsText] = await Promise.all([
            fetchText(DATA_PATH, true),
            fetchText(INFO_PATH, false),
            fetchText(DESC_PATH, false),
            fetchText(HINTS_PATH, false),
          ]);

          infoEl.textContent = infoText.trim() || "（尚未提供 info.md）";
          descEl.textContent = descText.trim() || "（尚未提供 desc.md）";
          loadHints(hintsText);

          const matrix = parseCsv(dataText);
          if (matrix.length < 1) {
            throw new Error("CSV 內容為空。請確認 data.csv。 ");
          }

          const headers = matrix[0].map((h) => String(h || "").trim());
          const dataRows = matrix.slice(1);

          state.columns = headers;
          state.displayColumns = headers.map((h) => normalizeHeaderName(h));
          state.rows = normalizeRows(headers, dataRows);
          state.filters = headers
            .map((h, i) => toFilterMeta(h, i))
            .filter((x) => x !== null);

          renderToolbar();
          renderGrid();
        } catch (error) {
          toolbarEl.innerHTML = "";
          theadEl.innerHTML = "";
          tbodyEl.innerHTML = "";
          metaEl.classList.add("error");
          metaEl.textContent = `初始化失敗：${error.message}\n請確認同路徑存在 data.csv/info.md/desc.md/hints.csv，並使用 GitHub Pages 或 HTTP 伺服器開啟。`;
        }
      }

      init();
    </script>
  </body>
</html>
