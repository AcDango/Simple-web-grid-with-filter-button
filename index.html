<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSV Grid Filter</title>
    <style>
      :root {
        --bg: #f7f8fb;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #d1d5db;
        --primary: #2563eb;
        --primary-soft: #dbeafe;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Noto Sans TC", "Segoe UI", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
      .info-card, .desc-card, .toolbar, .grid-wrap {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .info-card, .desc-card { padding: 14px; margin-bottom: 12px; }
      .card-title { margin: 0 0 8px; font-size: 15px; color: var(--muted); }
      .md-body { margin: 0; line-height: 1.7; white-space: pre-wrap; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; padding: 12px; }
      .toolbar.multi { margin-top: -4px; }
      .toolbar.multi:empty { display: none; }
      .multi-label { width: 100%; font-size: 13px; color: var(--muted); margin-top: -2px; margin-bottom: -4px; }
      .btn {
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text);
        padding: 8px 12px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 14px;
      }
      .btn:hover { border-color: var(--primary); }
      .btn.active {
        border-color: var(--primary);
        background: var(--primary-soft);
        color: var(--primary);
        font-weight: 700;
      }
      .btn.clear { border-color: #fca5a5; color: #b91c1c; }
      .btn.multi-active { border-color: #0f766e; background: #ccfbf1; }
      .grid-wrap { overflow: auto; }
      table { width: 100%; border-collapse: collapse; }
      th, td {
        border-bottom: 1px solid #e5e7eb;
        border-right: 1px solid #e5e7eb;
        padding: 10px;
        text-align: left;
        vertical-align: top;
        min-width: 120px;
      }
      th { background: #f3f4f6; position: sticky; top: 0; z-index: 1; }
      tr:last-child td { border-bottom: none; }
      .meta { margin: 8px 0 14px; color: var(--muted); font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="container">
      <section class="info-card">
        <h2 class="card-title">網頁資訊</h2>
        <p id="info" class="md-body"></p>
      </section>

      <section class="desc-card">
        <h2 class="card-title">補充說明</h2>
        <p id="desc" class="md-body"></p>
      </section>

      <div id="toolbar" class="toolbar"></div>
      <div id="multiToolbar" class="toolbar multi"></div>
      <div id="meta" class="meta"></div>
      <div class="grid-wrap">
        <table id="grid"><thead></thead><tbody></tbody></table>
      </div>
    </div>

    <script>
      const DATA_PATH = "./data.csv";
      const INFO_PATH = "./info.md";
      const DESC_PATH = "./desc.md";
      const FIELD_DEF_PATH = "./hint.csv";

      const infoEl = document.getElementById("info");
      const descEl = document.getElementById("desc");
      const toolbarEl = document.getElementById("toolbar");
      const multiToolbarEl = document.getElementById("multiToolbar");
      const metaEl = document.getElementById("meta");
      const theadEl = document.querySelector("#grid thead");
      const tbodyEl = document.querySelector("#grid tbody");

      const state = {
        rows: [],
        columns: [],
        fbuttonFilters: [],
        fmultiFilters: [],
        activeFbuttonKeys: new Set(),
        activeMultiSelections: new Map(),
        fieldDefs: new Map(),
      };

      function parseCsv(text) {
        const rows = [];
        let current = "";
        let row = [];
        let inQuotes = false;

        for (let i = 0; i < text.length; i += 1) {
          const char = text[i];
          const next = text[i + 1];
          if (char === '"') {
            if (inQuotes && next === '"') {
              current += '"';
              i += 1;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (char === "," && !inQuotes) {
            row.push(current);
            current = "";
          } else if ((char === "\n" || char === "\r") && !inQuotes) {
            if (char === "\r" && next === "\n") {
              i += 1;
            }
            row.push(current);
            if (row.some((cell) => cell.trim() !== "")) {
              rows.push(row);
            }
            row = [];
            current = "";
          } else {
            current += char;
          }
        }

        if (current.length > 0 || row.length > 0) {
          row.push(current);
          if (row.some((cell) => cell.trim() !== "")) {
            rows.push(row);
          }
        }
        return rows;
      }

      function splitSettings(value) {
        return String(value || "")
          .split(";")
          .map((x) => x.trim())
          .filter((x) => x !== "");
      }

      function isValidHexColor(value) {
        return /^#[0-9a-fA-F]{3}$|^#[0-9a-fA-F]{6}$/.test(String(value || "").trim());
      }

      function loadFieldDefs(text) {
        state.fieldDefs.clear();
        if (!text.trim()) {
          return;
        }

        const matrix = parseCsv(text);
        if (matrix.length <= 1) {
          return;
        }

        const headers = matrix[0].map((h) => String(h || "").trim().toLowerCase());
        const keyIndex = headers.indexOf("key");
        const typeIndex = headers.indexOf("type");
        const hintIndex = headers.indexOf("hint");
        const setting1Index = headers.indexOf("setting1");
        const setting2Index = headers.indexOf("setting2");

        if (keyIndex < 0) {
          return;
        }

        matrix.slice(1).forEach((row) => {
          const key = String(row[keyIndex] || "").trim();
          if (!key) {
            return;
          }

          const type = String(typeIndex >= 0 ? row[typeIndex] || "" : "")
            .trim()
            .toLowerCase();
          const hint = String(hintIndex >= 0 ? row[hintIndex] || "" : "").trim();
          const values = splitSettings(setting1Index >= 0 ? row[setting1Index] || "" : "");
          const colors = splitSettings(setting2Index >= 0 ? row[setting2Index] || "" : "");

          const colorMap = new Map();
          values.forEach((label, idx) => {
            const c = colors[idx] || "";
            if (isValidHexColor(c)) {
              colorMap.set(label, c);
            }
          });

          state.fieldDefs.set(key, {
            key,
            type,
            hint,
            values,
            colors,
            colorMap,
          });
        });
      }

      function truthyCell(value) {
        const normalized = String(value ?? "")
          .trim()
          .toLowerCase();
        if (!normalized) {
          return false;
        }
        return !["0", "false", "no", "off", "null", "none", "n"].includes(normalized);
      }

      function normalizeRows(headers, rawRows) {
        return rawRows.map((rawRow) => {
          const obj = {};
          headers.forEach((h, i) => {
            obj[h] = String(rawRow[i] ?? "").trim();
          });
          return obj;
        });
      }

      function buildFiltersFromDefs() {
        state.fbuttonFilters = [];
        state.fmultiFilters = [];

        state.columns.forEach((column, index) => {
          const def = state.fieldDefs.get(column);
          if (!def) {
            return;
          }

          if (def.type === "fbutton") {
            state.fbuttonFilters.push({
              key: `fbutton_${index}`,
              columnIndex: index,
              column,
              label: column,
              hint: def.hint,
            });
          }

          if (def.type === "fmulti") {
            const fallbackItems = [...new Set(state.rows.map((row) => row[column]).filter(Boolean))];
            const items = def.values.length > 0 ? def.values : fallbackItems;
            state.fmultiFilters.push({
              key: `fmulti_${index}`,
              columnIndex: index,
              column,
              label: column,
              hint: def.hint,
              items,
              colorMap: def.colorMap,
            });
          }
        });
      }

      function getHint(column) {
        return state.fieldDefs.get(column)?.hint || "";
      }

      async function fetchText(path) {
        const response = await fetch(path, { cache: "no-store" });
        if (!response.ok) {
          return "";
        }
        return response.text();
      }

      function rowMatchesFbuttonFilters(row) {
        if (state.activeFbuttonKeys.size === 0) {
          return true;
        }
        const activeFilters = state.fbuttonFilters.filter((f) => state.activeFbuttonKeys.has(f.key));
        return activeFilters.every((filter) => truthyCell(row[state.columns[filter.columnIndex]]));
      }

      function rowMatchesFmultiFilters(row) {
        if (state.activeMultiSelections.size === 0) {
          return true;
        }

        return state.fmultiFilters.every((filter) => {
          const selected = state.activeMultiSelections.get(filter.key);
          if (!selected || selected.size === 0) {
            return true;
          }
          return selected.has(row[filter.column]);
        });
      }

      function activeRows() {
        return state.rows.filter((row) => rowMatchesFbuttonFilters(row) && rowMatchesFmultiFilters(row));
      }

      function renderToolbar() {
        toolbarEl.innerHTML = "";
        multiToolbarEl.innerHTML = "";

        const clearBtn = document.createElement("button");
        clearBtn.className = "btn clear";
        clearBtn.textContent = "清除篩選";
        clearBtn.addEventListener("click", () => {
          state.activeFbuttonKeys.clear();
          state.activeMultiSelections.clear();
          renderToolbar();
          renderGrid();
        });
        toolbarEl.appendChild(clearBtn);

        state.fbuttonFilters.forEach((filter) => {
          const btn = document.createElement("button");
          btn.className = "btn";
          btn.textContent = filter.label;
          if (filter.hint) {
            btn.title = filter.hint;
          }
          if (state.activeFbuttonKeys.has(filter.key)) {
            btn.classList.add("active");
          }

          btn.addEventListener("click", () => {
            if (state.activeFbuttonKeys.has(filter.key)) {
              state.activeFbuttonKeys.delete(filter.key);
            } else {
              state.activeFbuttonKeys.add(filter.key);
            }
            renderToolbar();
            renderGrid();
          });
          toolbarEl.appendChild(btn);
        });

        state.fmultiFilters.forEach((filter) => {
          const rowLabel = document.createElement("div");
          rowLabel.className = "multi-label";
          rowLabel.textContent = `${filter.label}：`;
          if (filter.hint) {
            rowLabel.title = filter.hint;
          }
          multiToolbarEl.appendChild(rowLabel);

          filter.items.forEach((item) => {
            const btn = document.createElement("button");
            btn.className = "btn";
            btn.textContent = item;
            const color = filter.colorMap.get(item);
            if (color) {
              btn.style.color = color;
            }

            const activeSet = state.activeMultiSelections.get(filter.key) || new Set();
            if (activeSet.has(item)) {
              btn.classList.add("multi-active");
            }

            btn.addEventListener("click", () => {
              const selected = state.activeMultiSelections.get(filter.key) || new Set();
              if (selected.has(item)) {
                selected.delete(item);
              } else {
                selected.add(item);
              }

              if (selected.size === 0) {
                state.activeMultiSelections.delete(filter.key);
              } else {
                state.activeMultiSelections.set(filter.key, selected);
              }

              renderToolbar();
              renderGrid();
            });

            multiToolbarEl.appendChild(btn);
          });
        });
      }

      function renderGrid() {
        const rows = activeRows();
        theadEl.innerHTML = "";
        tbodyEl.innerHTML = "";

        if (state.columns.length > 0) {
          const headRow = document.createElement("tr");
          state.columns.forEach((column) => {
            const th = document.createElement("th");
            th.textContent = column;
            const hint = getHint(column);
            if (hint) {
              th.title = hint;
            }
            headRow.appendChild(th);
          });
          theadEl.appendChild(headRow);
        }

        rows.forEach((rowObj) => {
          const tr = document.createElement("tr");
          state.columns.forEach((column) => {
            const td = document.createElement("td");
            const value = rowObj[column];
            td.textContent = value;

            const filter = state.fmultiFilters.find((f) => f.column === column);
            const color = filter?.colorMap.get(value);
            if (color) {
              td.style.color = color;
            }

            tr.appendChild(td);
          });
          tbodyEl.appendChild(tr);
        });

        metaEl.textContent = `顯示 ${rows.length} / ${state.rows.length} 筆`;
      }

      async function init() {
        const [dataText, infoText, descText, fieldDefText] = await Promise.all([
          fetchText(DATA_PATH),
          fetchText(INFO_PATH),
          fetchText(DESC_PATH),
          fetchText(FIELD_DEF_PATH),
        ]);

        infoEl.textContent = infoText.trim() || "（尚未提供 info.md）";
        descEl.textContent = descText.trim() || "（尚未提供 desc.md）";
        loadFieldDefs(fieldDefText);

        if (!dataText.trim()) {
          state.columns = [];
          state.rows = [];
          state.fbuttonFilters = [];
          state.fmultiFilters = [];
          renderToolbar();
          renderGrid();
          return;
        }

        const matrix = parseCsv(dataText);
        if (matrix.length < 1) {
          state.columns = [];
          state.rows = [];
          state.fbuttonFilters = [];
          state.fmultiFilters = [];
          renderToolbar();
          renderGrid();
          return;
        }

        state.columns = matrix[0].map((h) => String(h || "").trim());
        state.rows = normalizeRows(state.columns, matrix.slice(1));
        buildFiltersFromDefs();

        renderToolbar();
        renderGrid();
      }

      init();
    </script>
  </body>
</html>
